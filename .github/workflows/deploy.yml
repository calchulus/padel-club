name: Deploy Padel Club to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Engine tests
        run: node tests/engine.test.js
      - name: Build site
        run: |
          python3 build.py
          mkdir -p _site
          cp padel-club-tycoon.html _site/index.html
          cp padel-club-tycoon.html _site/padel-club-tycoon.html
          cp bangkok_accessible_family_club.json _site/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry1.outputs.page_url || steps.retry2.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # The Pages deployment API returns HTTP 500 during platform incidents, and
      # deploy-pages does not retry creation itself (error_count only polls status).
      # Back off and retry so a transient outage does not leave a stale site.
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Back off before retry 1
        if: steps.deployment.outcome == 'failure'
        run: sleep 90
      - name: Deploy (retry 1)
        id: retry1
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Back off before retry 2
        if: steps.deployment.outcome == 'failure' && steps.retry1.outcome == 'failure'
        run: sleep 240
      - name: Deploy (retry 2)
        id: retry2
        if: steps.deployment.outcome == 'failure' && steps.retry1.outcome == 'failure'
        uses: actions/deploy-pages@v4
